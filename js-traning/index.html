<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="stylesheet" href="css/style.css">

      <title>JS training</title>
    </head>
    <body>
        <h1 id="title">Java Script Training!</h1>
        <button id="theme-btn">Toggle Theme</button>
        <ul id="names-list"></ul>
        <button id="add-name">Add Name</button>
        <button id="my-btn"> button </button>
        <button id="box"> mouse event </button>
        <input type="text" id="name-input">
        <div id="cards"></div>
       
        <ul id="todo-list">
            <li data-id="1">Buy milk</li>
            <li data-id="2">Walk dog</li>
            <li data-id="3">Pay bills</li>
        </ul>

        <p>...........................................................................</p>
        <p>Clicks: <span id="count">0</span></p>
        <button id="counter-btn">Click me</button>
        <p></p>

        <input id="live-input" placeholder="Type something..." />
        <p id="preview">Start typing...</p>

        <form id="reg-form">
        <input id="name-field" placeholder="Your name" />
        <button type="submit">Submit</button>
        </form>
        <p id="welcome"></p>

        <Button id="color-change">Color Change</Button>
          
            
        <br>
        <br>
        <input id="less" type="text" >

        <form id="number-form">
            <input id="num1" type="number">
            <input id="num2" type="number">
            <button id="sum" type="submit">submit</button>
            <p id="below"></p>
        </form>
        <style>
            .done { text-decoration: line-through; opacity: 0.5; }
            .dark { background: #111; color: #eee; }
            .name-item { padding: 4px 8px; }
        </style>
        <script type="module" src="js/classwork/script.js"></script>
</body>
</html>
